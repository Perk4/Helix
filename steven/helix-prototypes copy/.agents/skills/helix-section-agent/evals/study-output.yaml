description: HELIX study-output checks for a Section Draft Candidate

assert:
  - type: is-json
  - type: contains
    value: section_draft_candidate
  - type: contains
    value: validated_claim_ids
  - type: contains
    value: factual_spans
  - type: not-contains
    value: release-ready
  - type: not-contains
    value: approved
