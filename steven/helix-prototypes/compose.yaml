services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helix}
      POSTGRES_USER: ${POSTGRES_USER:-helix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helix-local-only}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helix} -d ${POSTGRES_DB:-helix}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - helix-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HELIX_DATABASE_URL: ${HELIX_DATABASE_URL:-postgresql+psycopg://helix:helix-local-only@db:5432/helix}
      HELIX_CORS_ORIGINS: '${HELIX_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      HELIX_AUTO_SEED: "true"
      HELIX_SEED_PATH: /app/synthetic-e2e/helix-synthetic-bundle.json
      HELIX_LLM_BASE_URL: ${HELIX_LLM_BASE_URL:-https://api.openai.com/v1}
      HELIX_LLM_MODEL: ${HELIX_LLM_MODEL:-gpt-5-mini}
      HELIX_LLM_API_KEY: ${HELIX_LLM_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  helix-postgres:
