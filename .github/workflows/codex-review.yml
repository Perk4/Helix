name: Codex PR review

on:
  pull_request:
    types: [opened, synchronize]

permissions: {}

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
      head_sha: ${{ steps.metadata.outputs.head-sha }}
    steps:
      - name: Read review metadata
        id: metadata
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          printf 'head-sha=%s\n' "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          printf 'key-configured=%s\n' "$KEY_CONFIGURED" >> "$GITHUB_OUTPUT"
          if [[ "$KEY_CONFIGURED" != "true" ]]; then
            echo "::notice::OPENAI_API_KEY is not configured. Codex review was skipped."
          fi

      - name: Check out the pull request merge commit
        if: steps.metadata.outputs.key-configured == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Review the pull request
        id: codex
        if: steps.metadata.outputs.key-configured == 'true'
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ vars.OPENAI_RESPONSES_API_ENDPOINT }}
          model: ${{ vars.OPENAI_CODEX_MODEL }}
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          prompt: |
            Review only the changes introduced by this pull request.
            The current working directory is the repository root.
            The HELIX project is at steven/helix-prototypes.
            Run this diff from the repository root:
            git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

            Report only high-confidence correctness, security, data-integrity, or regression findings that require developer action.
            Do not report formatting, style, or speculative concerns.
            Do not modify files.
            For each finding, name the file and line, explain the impact, and propose the smallest fix.
            If there are no findings, say so concisely.

  post-review:
    needs: review
    if: >-
      needs.review.result == 'success' &&
      needs.review.outputs.final_message != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Update the Codex review comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.review.outputs.final_message }}
          EXPECTED_HEAD_SHA: ${{ needs.review.outputs.head_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- codex-pr-review -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.payload.pull_request.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issueNumber,
            });

            if (
              pullRequest.state !== 'open' ||
              pullRequest.head.sha !== process.env.EXPECTED_HEAD_SHA
            ) {
              core.notice('The pull request closed or changed. The stale Codex review was not posted.');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker),
            );
            const review = process.env.CODEX_FINAL_MESSAGE.slice(0, 60000);
            const body = `${marker}\n## Codex review\n\n${review}\n\n_Reviewed ${process.env.EXPECTED_HEAD_SHA.slice(0, 7)}._`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body,
            });
